# Handheld Daemon State Config
#
# This file contains plugin software-only configuration that will be retained
# across reboots. You may edit this file in lueu of using a frontend.
# This header is on the bottom to make editing easier with e.g., nano.
#
# Parameters that are stored in hardware (TDP, RGB colors, etc) and
# risky parameters that might cause instability and should be reset
# across sessions are not part of this file.
# Use profiles to apply changes to these settings.
#
# Persisted (software) parameters are marked by having a default value.
# Non-persisted/hardware parameters do not have a default value.
#
# This file and comments are autogenerated. Your comments will be discarded
# during configuration changes. Parameters with the value `default` are
# ignored and are meant as a template for you to change them.
#
# - CONFIGURATION PARAMETERS
#
# ┌> tdp.asus
# │ *Asus TDP*
# │ Uses the interface of Armory Crate to set the TDP of the device. 
# │
# │┌> tdp.asus.tdp_v2
# ││ *TDP Mode*
# ││ - modes: [quiet, balanced, performance, custom]
# ││ - default: balanced
# ││
# ││┌> tdp.asus.tdp_v2.quiet
# │││ 
# │││ *Silent*
# │││
# ││┌> tdp.asus.tdp_v2.balanced
# │││ 
# │││ *Performance*
# │││
# ││┌> tdp.asus.tdp_v2.performance
# │││ 
# │││ *Turbo*
# │││
# ││┌> tdp.asus.tdp_v2.custom
# │││ 
# │││ *Custom*
# │││
# │││┌> tdp.asus.tdp_v2.custom.tdp
# ││││ *TDP*
# ││││ Average TDP Target. TDP Boost is recommended for desktop use and does not affect 
# ││││ gaming. 
# │││└ - default: 17
# │││
# │││┌> tdp.asus.tdp_v2.custom.boost
# ││││ *TDP Boost*
# ││││ Allows the device to temporarily boost by setting appropriate slow and fast 
# ││││ TDPs. 
# ││││ - boolean: [False, True]
# │└└└ - default: True
# │
# │┌> tdp.asus.sys_tdp
# ││ 
# │└ * *
# │
# │┌> tdp.asus.cycle_tdp
# ││ *Change TDP with View+Y*
# ││ Allows you to cycle through TDP modes with the View+Y key combination. 
# ││ Recommended to use with ROG Swap, as the View button will be muted to games. 
# ││ - boolean: [False, True]
# │└ - default: False
# │
# │┌> tdp.asus.fan
# ││ *Custom Fan Curve*
# ││ Allows you to set a custom fan curve. 
# ││ - modes: [disabled, manual]
# ││ - default: disabled
# ││
# ││┌> tdp.asus.fan.disabled
# │││ *Disabled*
# │││ Lets the device manage the fan curve on its own. 
# │││
# ││┌> tdp.asus.fan.manual
# │││ 
# │││ *Manual*
# │││
# │││┌> tdp.asus.fan.manual.st30
# ││││ *30C*
# ││││ Sets the speed at the named temperature. 
# │││└ - default: 5
# │││
# │││┌> tdp.asus.fan.manual.st40
# ││││ *40C*
# ││││ Sets the speed at the named temperature. 
# │││└ - default: 10
# │││
# │││┌> tdp.asus.fan.manual.st50
# ││││ *50C*
# ││││ Sets the speed at the named temperature. 
# │││└ - default: 20
# │││
# │││┌> tdp.asus.fan.manual.st60
# ││││ *60C*
# ││││ Sets the speed at the named temperature. 
# │││└ - default: 35
# │││
# │││┌> tdp.asus.fan.manual.st70
# ││││ *70C*
# ││││ Sets the speed at the named temperature. 
# │││└ - default: 55
# │││
# │││┌> tdp.asus.fan.manual.st80
# ││││ *80C*
# ││││ Sets the speed at the named temperature. 
# │││└ - default: 75
# │││
# │││┌> tdp.asus.fan.manual.st90
# ││││ *90C*
# ││││ Sets the speed at the named temperature. 
# │││└ - default: 75
# │││
# │││┌> tdp.asus.fan.manual.st100
# ││││ *100C*
# ││││ Sets the speed at the named temperature. 
# │││└ - default: 75
# │││
# │││┌> tdp.asus.fan.manual.reset
# ││││ *Restore Default*
# ││││ Restore a default sane fan curve. 
# │││└ - action: Set to True to run.
# │││
# │││┌> tdp.asus.fan.manual.disclaimer
# ││││ *Fan Curve Limitation*
# └└└└ - default: Asus hardware limits the minimum fan curve depending on TDP mode.
# 
# ┌> tdp.amd_energy
# │ 
# │ *Processor Settings*
# │
# │┌> tdp.amd_energy.mode
# ││ *CPU Settings*
# ││ - modes: [auto, manual]
# ││ - default: auto
# ││
# ││┌> tdp.amd_energy.mode.auto
# │││ *Auto*
# │││ Handheld Daemon will manage the energy management settings. This includes CPU 
# │││ governor, CPU boost, GPU frequency, and CPU power preferences. At low TDPs, the 
# │││ CPU will be tuned down and at other TDPs, it will use balanced settings. 
# │││
# ││┌> tdp.amd_energy.mode.manual
# │││ *Manual*
# │││ Allows you to set the energy management settings manually. 
# │││
# │││┌> tdp.amd_energy.mode.manual.cpu_pref
# ││││ *CPU Power (EPP)*
# ││││ Sets the energy performance preference for the CPU. Keep on balanced for good 
# ││││ performance on all TDPs. Options map to `power`, `balance_power`, 
# ││││ `balance_performance`. Performance is not recommended and is not included. 
# ││││ - options: [power, balance_power, balance_performance]
# │││└ - default: balance_power
# │││
# │││┌> tdp.amd_energy.mode.manual.cpu_min_freq
# ││││ *CPU Minimum Frequency*
# ││││ Sets the minimum frequency for the CPU. Using 400MHz will save battery in light 
# ││││ games. However, the delay of increasing the frequency may cause minor stutters, 
# ││││ especially in VRR displays. 
# ││││ - options: [min, nonlinear]
# │││└ - default: min
# │││
# │││┌> tdp.amd_energy.mode.manual.cpu_boost
# ││││ *CPU Boost*
# ││││ Enables or disables the CPU boost frequencies. Disabling lowers total 
# ││││ consumption by 2W with  minimal performance impact. 
# ││││ - options: [disabled, enabled]
# │└└└ - default: enabled
# │
# │┌> tdp.amd_energy.gpu_freq
# ││ *GPU Frequency*
# ││ Pins the GPU to a certain frequency. Helps in certain games that are CPU or GPU 
# ││ heavy by shifting power to or from the GPU. Has a minor effect. 
# ││ - modes: [auto, upper, range, manual]
# ││ - default: auto
# ││
# ││┌> tdp.amd_energy.gpu_freq.auto
# │││ *Auto*
# │││ Lets the GPU manage its own frequency. 
# │││
# ││┌> tdp.amd_energy.gpu_freq.upper
# │││ *Max Limit*
# │││ Limits the maximum frequency of the GPU. 
# │││
# │││┌> tdp.amd_energy.gpu_freq.upper.frequency
# ││││ *Maximum Frequency*
# ││└└ - default: 2700
# ││
# ││┌> tdp.amd_energy.gpu_freq.range
# │││ *Range*
# │││ Sets the GPU frequency to a range. 
# │││
# │││┌> tdp.amd_energy.gpu_freq.range.min
# ││││ *Minimum Frequency*
# │││└ - default: 800
# │││
# │││┌> tdp.amd_energy.gpu_freq.range.max
# ││││ *Maximum Frequency*
# ││└└ - default: 2700
# ││
# ││┌> tdp.amd_energy.gpu_freq.manual
# │││ *Fixed*
# │││ Pins the GPU to a certain frequency (not recommended). 
# │││
# │││┌> tdp.amd_energy.gpu_freq.manual.frequency
# ││││ *Frequency*
# └└└└ - default: 1700
# 
# ┌> tdp.battery
# │ 
# │ *Battery Settings*
# │
# │┌> tdp.battery.charge_limit
# ││ *Charge Limit (%)*
# ││ Applies a charge limit to the battery, 75% and up. 
# ││ - options: [p70, p80, p85, p90, p95, disabled]
# └└ - default: disabled
# 
# ┌> rgb.handheld
# │ 
# │ *RGB Settings*
# │
# │┌> rgb.handheld.mode
# ││ *RGB Mode*
# ││ - modes: [disabled, solid, pulse, duality, rainbow, spiral]
# ││ - default: solid
# ││
# ││┌> rgb.handheld.mode.disabled
# │││ *Off*
# │││ Turns the LEDs off. 
# │││
# ││┌> rgb.handheld.mode.solid
# │││ *Solid*
# │││ Maintains the LEDs at a solid color. 
# │││
# │││┌> rgb.handheld.mode.solid.hue
# ││││ *Hue*
# │││└ - default: 30
# │││
# │││┌> rgb.handheld.mode.solid.saturation
# ││││ *Saturation*
# │││└ - default: 100
# │││
# │││┌> rgb.handheld.mode.solid.brightness
# ││││ *Brightness*
# ││└└ - default: 50
# ││
# ││┌> rgb.handheld.mode.pulse
# │││ *Pulse*
# │││ Slowly pulses the LEDs as a prespecified color. 
# │││
# │││┌> rgb.handheld.mode.pulse.hue
# ││││ *Hue*
# │││└ - default: 30
# │││
# │││┌> rgb.handheld.mode.pulse.saturation
# ││││ *Saturation*
# │││└ - default: 100
# │││
# │││┌> rgb.handheld.mode.pulse.brightness
# ││││ *Brightness*
# │││└ - default: 50
# │││
# │││┌> rgb.handheld.mode.pulse.speedd
# ││││ *Speed*
# ││││ - options: [low, medium, high]
# ││└└ - default: medium
# ││
# ││┌> rgb.handheld.mode.duality
# │││ *Duality*
# │││ Alternates between two colors. 
# │││
# │││┌> rgb.handheld.mode.duality.hue
# ││││ *Hue*
# │││└ - default: 60
# │││
# │││┌> rgb.handheld.mode.duality.hue2
# ││││ *Secondary*
# │││└ - default: 30
# │││
# │││┌> rgb.handheld.mode.duality.saturation
# ││││ *Saturation*
# │││└ - default: 100
# │││
# │││┌> rgb.handheld.mode.duality.brightness
# ││││ *Brightness*
# │││└ - default: 50
# │││
# │││┌> rgb.handheld.mode.duality.speedd
# ││││ *Speed*
# ││││ - options: [low, medium, high]
# ││└└ - default: medium
# ││
# ││┌> rgb.handheld.mode.rainbow
# │││ *Rainbow*
# │││ Cycles through the different colors. 
# │││
# │││┌> rgb.handheld.mode.rainbow.brightnessd
# ││││ *Brightness*
# ││││ - options: [low, medium, high]
# ││└└ - default: medium
# ││
# ││┌> rgb.handheld.mode.spiral
# │││ *Spiral*
# │││ Creates an RGB spiral around the stick. 
# │││
# │││┌> rgb.handheld.mode.spiral.brightnessd
# ││││ *Brightness*
# ││││ - options: [low, medium, high]
# │││└ - default: medium
# │││
# │││┌> rgb.handheld.mode.spiral.speedd
# ││││ *Speed*
# ││││ - options: [low, medium, high]
# │││└ - default: medium
# │││
# │││┌> rgb.handheld.mode.spiral.direction
# ││││ *Direction*
# ││││ - options: [left, right]
# └└└└ - default: left
# 
# ┌> controllers.rog_ally
# │ *Ally Controller*
# │ Allows for configuring the ROG Ally controllers to a unified output. 
# │
# │┌> controllers.rog_ally.controller_mode
# ││ *Controller Emulation*
# ││ Emulate different controller types to fuse ROG features. 
# ││ - modes: [hidden, uinput, xbox_elite, dualsense]
# ││ - default: uinput
# ││
# ││┌> controllers.rog_ally.controller_mode.hidden
# │││ *Hidden*
# │││ Disables the controller. Handheld Daemon overlay will still work in gamemode. 
# │││
# │││┌> controllers.rog_ally.controller_mode.hidden.info
# ││││ **
# ││││ - default: Disables the built-in controller.
# ││││ External controllers will be slot 1.
# ││││ Overlay will still work.
# │││└ 
# │││
# │││┌> controllers.rog_ally.controller_mode.hidden.noob_mode
# ││││ *Extra buttons as Keyboard/Overlay*
# ││││ Makes the left paddle bring up a keyboard and the right paddle bring up the 
# ││││ overlay. 
# ││││ - boolean: [False, True]
# ││└└ - default: True
# ││
# ││┌> controllers.rog_ally.controller_mode.uinput
# │││ 
# │││ *Xbox*
# │││
# │││┌> controllers.rog_ally.controller_mode.uinput.info
# ││││ **
# ││││ - default: Simple Xbox controller. 
# ││││ Universal compatibility.
# ││││ Extra buttons are shortcuts or Steam Input.
# │││└ 
# │││
# │││┌> controllers.rog_ally.controller_mode.uinput.paddles_as
# ││││ *Extra buttons as*
# ││││ Changes the behavior of the extra buttons. Left button is Keyboard, right button 
# ││││ is Overlay. Or they can be set for Steam Input. 
# ││││ - options: [steam_input, noob, disabled]
# │││└ - default: noob
# │││
# │││┌> controllers.rog_ally.controller_mode.uinput.nintendo_qam
# ││││ *Nintendo QAM Fix*
# ││││ - boolean: [False, True]
# ││└└ - default: False
# ││
# ││┌> controllers.rog_ally.controller_mode.xbox_elite
# │││ 
# │││ *Xbox Elite*
# │││
# │││┌> controllers.rog_ally.controller_mode.xbox_elite.info
# ││││ **
# ││││ - default: Extra buttons in Steam Input.
# ││└└ 
# ││
# ││┌> controllers.rog_ally.controller_mode.dualsense
# │││ 
# │││ *Dualsense*
# │││
# │││┌> controllers.rog_ally.controller_mode.dualsense.info
# ││││ **
# ││││ - default: Touchpad, gyro, and RGB support. Extra buttons are remappable.
# │││└ 
# │││
# │││┌> controllers.rog_ally.controller_mode.dualsense.paddles_as
# ││││ *Extra buttons as*
# ││││ Changes the behavior of the extra buttons. Left button is Keyboard, right button 
# ││││ is Overlay. Or they can be left/right touchpad clicks. For the legion go, top 
# ││││ buttons are shortcuts, bottom are touchpad clicks. 
# ││││ - options: [steam_input, noob, touchpad, disabled]
# │││└ - default: steam_input
# │││
# │││┌> controllers.rog_ally.controller_mode.dualsense.led_support
# ││││ *LED Support*
# ││││ Passes through the LEDs to the controller, which allows games to control them. 
# ││││ - boolean: [False, True]
# │││└ - default: False
# │││
# │││┌> controllers.rog_ally.controller_mode.dualsense.sync_gyro
# ││││ *Gyro Output Sync*
# ││││ Steam relies on the IMU timestamp for the touchpad as Mouse and `Gyro to Mouse 
# ││││ [BETA]`. If the same timestamp is sent in 2 reports, this causes a division by 0 
# ││││ and instability. This option makes it so reports are sent only when there is a 
# ││││ new IMU timestamp, effectively limiting the responsiveness of the controller to 
# ││││ that of the IMU. This only makes a difference for the Legion Go (125hz), as all 
# ││││ the other handhelds are using 400hz by default. 
# ││││ - boolean: [False, True]
# │││└ - default: True
# │││
# │││┌> controllers.rog_ally.controller_mode.dualsense.flip_z
# ││││ *Invert Roll Axis*
# ││││ Inverts the roll (Z) axis compared to a real Dualsense controller. Useful for 
# ││││ Steam Input, since you want it to be inverted to look left to right, but an 
# ││││ issue in emulators. 
# ││││ - boolean: [False, True]
# │││└ - default: True
# │││
# │││┌> controllers.rog_ally.controller_mode.dualsense.bluetooth_mode
# ││││ *Bluetooth Mode*
# ││││ Emulates the controller in bluetooth mode instead of USB mode. This is the 
# ││││ default as it causes less issues with how apps interact with the controller. 
# ││││ However, using USB mode can improve LED support (?) in some games. Test and 
# ││││ report back! 
# ││││ - boolean: [False, True]
# │└└└ - default: True
# │
# │┌> controllers.rog_ally.swap_armory
# ││ *Swap ROG and Menu/View*
# ││ Swaps the Armory Crate and Command center buttons with start and select. 
# ││ - boolean: [False, True]
# │└ - default: False
# │
# │┌> controllers.rog_ally.imu
# ││ *Motion Support*
# ││ Enable gyroscope/accelerometer (IMU) support (.3% background CPU use) 
# ││ - boolean: [False, True]
# │└ - default: True
# │
# │┌> controllers.rog_ally.imu_hz
# ││ *Motion Hz*
# ││ Sets the sampling frequency for the IMU. 
# ││ - options: [100, 200, 400, 800]
# │└ - default: 200
# │
# │┌> controllers.rog_ally.limits
# ││ *Deadzones & Vibration*
# ││ Configure joystick and trigger deadzones, vibration intensity. 
# ││ - modes: [default, manual]
# ││ - default: default
# ││
# ││┌> controllers.rog_ally.limits.default
# │││ *Default*
# │││ Uses reasonable values based on hardware. 
# │││
# ││┌> controllers.rog_ally.limits.manual
# │││ *Manual*
# │││ Allows for manual configuration of deadzones and vibration intensity. 
# │││
# │││┌> controllers.rog_ally.limits.manual.vibration
# ││││ *Vibration Intensity*
