version: fef7c551
tdp:
  asus:
    tdp_v2:
      mode: performance
      custom:
        tdp: default
        boost: default
    cycle_tdp: default
    fan:
      mode: default
      manual:
        st30: default
        st40: default
        st50: default
        st60: default
        st70: default
        st80: default
        st90: default
        st100: default
        disclaimer: default
  amd_energy:
    mode:
      mode: default
      manual:
        cpu_pref: default
        cpu_min_freq: default
        cpu_boost: default
    gpu_freq:
      mode: default
      upper:
        frequency: default
      range:
        min: default
        max: default
      manual:
        frequency: default
  battery:
    charge_limit: p80
  tdp:
    tdp_enable: false
    tdp_error: ''
rgb:
  handheld:
    mode:
      mode: default
      solid:
        hue: 310
        saturation: 70
        brightness: 10
      pulse:
        hue: default
        saturation: default
        brightness: default
        speedd: default
      duality:
        hue: default
        hue2: default
        saturation: default
        brightness: default
        speedd: default
      rainbow:
        brightnessd: default
      spiral:
        brightnessd: default
        speedd: default
        direction: default
controllers:
  rog_ally:
    controller_mode:
      mode: default
      hidden:
        info: default
        noob_mode: default
      uinput:
        info: default
        paddles_as: steam_input
        nintendo_qam: default
      xbox_elite:
        info: default
      dualsense:
        info: default
        paddles_as: default
        led_support: default
        sync_gyro: default
        flip_z: default
        bluetooth_mode: default
    swap_armory: default
    imu: default
    imu_hz: default
    limits:
      mode: manual
      manual:
        vibration: default
        ls_min: 2
        ls_max: default
        rs_min: 2
        rs_max: default
        lt_min: default
        lt_max: default
        rt_min: default
        rt_max: default
    select_reboots: default
    nintendo_mode: default
    rgb_boot: default
    rgb_charging: default
gamemode:
  power:
    hibernate_auto: default
shortcuts:
  controller:
    xbox_y: default
    xbox_b: default
    xbox_a: default
    xbox_x: default
    allow_select: default
  touchscreen:
    bottom: default
    right_top: default
    right_bottom: default
    left_top: default
    left_bottom: default
    top: default
  keyboard:
    meta_press: default
    meta_hold: default
    ctrl_3: default
    ctrl_4: default
hhd:
  settings:
    language: default
    theme: default
    tdp_enable: true
    enforce_limits: default
    amd_energy_enable: default
    amd_energy_ppd: default
    rgb: default
    powerbuttond: default
  http:
    localhost: default
    token: default
  steamos:
    gpu_set: default

