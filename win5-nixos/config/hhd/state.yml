# ┌> tdp.amd_energy
# │ 
# │ *Processor Settings*
# │
# │┌> tdp.amd_energy.enable_error
# ││ *Conflict Detected*
# │└ - default: Energy Management can not be enabled while PPD or TuneD are enabled. `systemctl mask power-profiles-daemon` or `tuned`.
# │
# │┌> tdp.amd_energy.enable
# ││ *Enable Processor Settings*
# └└ - action: Set to True to run.
# 
# ┌> tdp.smu
# │ 
# │ *Advanced Configurator*
# │
# │┌> tdp.smu.apply
# ││ *Apply Settings*
# │└ - action: Set to True to run.
# │
# │┌> tdp.smu.status
# ││ 
# │└ *TDP Status*
# │
# │┌> tdp.smu.energy_policy
# ││ *Energy Policy*
# ││ - options: [power, balanced, performance]
# │└ - default: balanced
# │
# │┌> tdp.smu.std
# ││ *Standard Parameters*
# ││ Standard TDP parameters for Ryzen processors. All need to be set to properly 
# ││ control the TDP of the device.
# ││ Ryzen processors have 2 modes: STTv2 and STAPM 
# ││ (legacy). AMD suggests to  manufacturers to use STTv2, which makes the Legion Go 
# ││ the only device to  offer the STAPM alternative through a BIOS setting.
# ││ In 
# ││ STTv2, the device will keep boosting until the "skin" of the device (hottest 
# ││ user accessible spot) reaches a manufacturer set temperature. Then, the device 
# ││ will use the Skin Temp TDP limit. In STAPM, the device averages the TDP values 
# ││ from the 1-3 previous minutes and keeps that value under the STAPM TDP limit. 
# ││ Either mode ignores the other mode's limit (STAPM limit does nothing on STT and 
# ││ Skin Temp Limit does nothing on STAPM), so both should be set.
# ││ The Fast and Slow 
# ││ limits control boosting behavior. The Fast TDP limit is the actual max TDP value 
# ││ of the device. Then,the Slow TDP limit averages the last 10-20s of TDP values 
# ││ and keeps the value below it. 
# ││
# ││┌> tdp.smu.std.fast_limit
# │││ *Fast TDP Limit*
# ││└ - default: 40
# ││
# ││┌> tdp.smu.std.slow_limit
# │││ *Slow TDP Limit*
# ││└ - default: 27
# ││
# ││┌> tdp.smu.std.skin_limit
# │││ *Skin Temp TDP Limit*
# ││└ - default: 25
# ││
# ││┌> tdp.smu.std.stapm_limit
# │││ *STAPM TDP Limit*
# │└└ - default: 25
# │
# │┌> tdp.smu.adv
# ││ *Advanced Parameters*
# ││ The Advanced Parameters below control boosting behavior and need to be adjusted 
# ││ per device depending on its cooling system. They mostly affect boosting 
# ││ behavior, which is important for desktop use.
# ││ The exception is the Temp Target 
# ││ (TCTL), which controls the max temperature of the CPU die. On most devices, it 
# ││ can safely be raised up to 100C.  However, if a temperature spike makes the chip 
# ││ reach 105C, it will enter a thermal protection mode, which is 5W, for a couple 
# ││ of minutes.
# ││ The integration times for Slow TDP and STAPM influence how many 
# ││ previous TDP values the CPU will average to calculate its current Slow and STAPM 
# ││  TDP values. 
# ││
# ││┌> tdp.smu.adv.temp_target
# │││ *Temp Target (TCTL)*
# ││└ - default: 95
# ││
# ││┌> tdp.smu.adv.slow_time
# │││ *Slow Limit Integration Time*
# ││└ - default: 10
# ││
# ││┌> tdp.smu.adv.stapm_time
# │││ *STAPM Limit Integration Time*
# ││└ - default: 200
# ││
# ││┌> tdp.smu.adv.enable
# │││ *Enable Advanced Parameters*
# │││ - boolean: [False, True]
# └└└ - default: False
# 
# ┌> tdp.battery
# │ 
# │ *Battery Settings*
# │
# ┌> controllers.gpd_win
# │ *GPD Controller*
# │ Allows for configuring the gpd win controllers to a unified output. 
# │
# │┌> controllers.gpd_win.controller_mode
# ││ *Controller Emulation*
# ││ Emulate different controller types to fuse gpd features. 
# ││ - modes: [hidden, uinput, xbox_elite, dualsense, disabled]
# ││ - default: uinput
# ││
# ││┌> controllers.gpd_win.controller_mode.hidden
# │││ *Hidden*
# │││ Disables the controller. Handheld Daemon overlay will still work in gamemode. 
# │││
# │││┌> controllers.gpd_win.controller_mode.hidden.info
# ││││ **
# ││││ - default: Disables the built-in controller.
# ││││ External controllers will be slot 1.
# ││││ Overlay will still work.
# │││└ 
# │││
# │││┌> controllers.gpd_win.controller_mode.hidden.noob_mode
# ││││ *Extra buttons as Keyboard/Overlay*
# ││││ Makes the left paddle bring up a keyboard and the right paddle bring up the 
# ││││ overlay. 
# ││││ - boolean: [False, True]
# ││└└ - default: True
# ││
# ││┌> controllers.gpd_win.controller_mode.uinput
# │││ 
# │││ *Xbox*
# │││
# │││┌> controllers.gpd_win.controller_mode.uinput.info
# ││││ **
# ││││ - default: Simple Xbox controller. 
# ││││ Universal compatibility.
# ││││ Extra buttons are shortcuts or Steam Input.
# │││└ 
# │││
# │││┌> controllers.gpd_win.controller_mode.uinput.paddles_as
# ││││ *Extra buttons as*
# ││││ Changes the behavior of the extra buttons. Left button is Keyboard, right button 
# ││││ is Overlay. Or they can be set for Steam Input. 
# ││││ - options: [steam_input, noob, disabled]
# │││└ - default: noob
# │││
# │││┌> controllers.gpd_win.controller_mode.uinput.nintendo_qam
# ││││ *Nintendo QAM Fix*
# ││││ - boolean: [False, True]
# ││└└ - default: False
# ││
# ││┌> controllers.gpd_win.controller_mode.xbox_elite
# │││ 
# │││ *Xbox Elite*
# │││
# │││┌> controllers.gpd_win.controller_mode.xbox_elite.info
# ││││ **
# ││││ - default: Extra buttons in Steam Input.
# ││└└ 
# ││
# ││┌> controllers.gpd_win.controller_mode.dualsense
# │││ 
# │││ *Dualsense*
# │││
# │││┌> controllers.gpd_win.controller_mode.dualsense.info
# ││││ **
# ││││ - default: Touchpad, gyro, and RGB support. Extra buttons are remappable.
# │││└ 
# │││
# │││┌> controllers.gpd_win.controller_mode.dualsense.paddles_as
# ││││ *Extra buttons as*
# ││││ Changes the behavior of the extra buttons. Left button is Keyboard, right button 
# ││││ is Overlay. Or they can be left/right touchpad clicks. For the legion go, top 
# ││││ buttons are shortcuts, bottom are touchpad clicks. 
# ││││ - options: [steam_input, noob, touchpad, disabled]
# │││└ - default: steam_input
# │││
# │││┌> controllers.gpd_win.controller_mode.dualsense.sync_gyro
# ││││ *Gyro Output Sync*
# ││││ Steam relies on the IMU timestamp for the touchpad as Mouse and `Gyro to Mouse 
# ││││ [BETA]`. If the same timestamp is sent in 2 reports, this causes a division by 0 
# ││││ and instability. This option makes it so reports are sent only when there is a 
# ││││ new IMU timestamp, effectively limiting the responsiveness of the controller to 
# ││││ that of the IMU. This only makes a difference for the Legion Go (125hz), as all 
# ││││ the other handhelds are using 400hz by default. 
# ││││ - boolean: [False, True]
# │││└ - default: True
# │││
# │││┌> controllers.gpd_win.controller_mode.dualsense.flip_z
# ││││ *Invert Roll Axis*
# ││││ Inverts the roll (Z) axis compared to a real Dualsense controller. Useful for 
# ││││ Steam Input, since you want it to be inverted to look left to right, but an 
# ││││ issue in emulators. 
# ││││ - boolean: [False, True]
# │││└ - default: True
# │││
# │││┌> controllers.gpd_win.controller_mode.dualsense.bluetooth_mode
# ││││ *Bluetooth Mode*
# ││││ Emulates the controller in bluetooth mode instead of USB mode. This is the 
# ││││ default as it causes less issues with how apps interact with the controller. 
# ││││ However, using USB mode can improve LED support (?) in some games. Test and 
# ││││ report back! 
# ││││ - boolean: [False, True]
# ││└└ - default: True
# ││
# ││┌> controllers.gpd_win.controller_mode.disabled
# │││ 
# │││ *Paused*
# │││
# │││┌> controllers.gpd_win.controller_mode.disabled.info
# ││││ **
# │└└└ - default: Pauses controller emulation.
# │
# │┌> controllers.gpd_win.l4r4
# ││ *Menu/L4/R4 Mapping*
# ││ Maps L4/R4 to Steam Input (requires L4/R4 as HHD in Wincontrols tab). If 
# ││ disabled, they are keyboard buttons. Menu/L4/R4 can be combos: Menu is 
# ││ single-press QAM, double HHD, hold Xbox. L4/R4 are single-press QAM, hold HHD 
# ││ (legacy).  
# ││ - options: [disabled, generic, menu, l4, r4]
# │└ - default: r4
# │
# │┌> controllers.gpd_win.main_chords
# ││ *Start/Select do SteamOS Combos*
# ││ When holding Select or Start, if another button is pressed, they become the Xbox 
# ││ button, which allows doing SteamOS combos (Select+RT is screenshot). 
# ││ - options: [disabled, select, start_select]
# │└ - default: disabled
# │
# │┌> controllers.gpd_win.imu
# ││ *Motion Support*
# ││ Enable gyroscope/accelerometer (IMU) support (.3% background CPU use) 
# ││ - boolean: [False, True]
# │└ - default: True
# │
# │┌> controllers.gpd_win.imu_hz
# ││ *Motion Hz*
# ││ Sets the sampling frequency for the IMU. 
# ││ - options: [100, 200, 400, 800]
# │└ - default: 400
# │
# │┌> controllers.gpd_win.imu_axis
# ││ *Motion Axis*
# ││ - modes: [default, remapped]
# ││ - default: default
# ││
# ││┌> controllers.gpd_win.imu_axis.default
# │││ *Default*
# │││ The default axis loaded for this device. 
# │││
# ││┌> controllers.gpd_win.imu_axis.remapped
# │││ *Override*
# │││ Remap and invert the axis of your device. If the axis of your device are wrong, 
# │││ please submit a picture or a text version of the following. 
# │││
# │││┌> controllers.gpd_win.imu_axis.remapped.manufacturer
# ││││ *Manufacturer*
# │││└ - default: "GPD"
# │││
# │││┌> controllers.gpd_win.imu_axis.remapped.product
# ││││ *Product*
# │││└ - default: "G1618-05"
# │││
# │││┌> controllers.gpd_win.imu_axis.remapped.x_axis
# ││││ *Axis X*
# ││││ - options: [x, y, z]
# │││└ - default: z
# │││
# │││┌> controllers.gpd_win.imu_axis.remapped.x_invert
# ││││ *Invert X*
# ││││ - boolean: [False, True]
# │││└ - default: True
# │││
# │││┌> controllers.gpd_win.imu_axis.remapped.y_axis
# ││││ *Axis Y*
# ││││ - options: [x, y, z]
# │││└ - default: x
# │││
# │││┌> controllers.gpd_win.imu_axis.remapped.y_invert
# ││││ *Invert Y*
# ││││ - boolean: [False, True]
# │││└ - default: False
# │││
# │││┌> controllers.gpd_win.imu_axis.remapped.z_axis
# ││││ *Axis Z*
# ││││ - options: [x, y, z]
# │││└ - default: y
# │││
# │││┌> controllers.gpd_win.imu_axis.remapped.z_invert
# ││││ *Invert Z*
# ││││ - boolean: [False, True]
# │└└└ - default: True
# │
# │┌> controllers.gpd_win.nintendo_mode
# ││ *Nintendo Mode (A-B Swap)*
# ││ Swaps A with B and X with Y. 
# ││ - boolean: [False, True]
# └└ - default: False
# 
# ┌> wincontrols.wincontrols
# │ *WinControls*
# │ Specialized settings for GPD devices. 
# │
# │┌> wincontrols.wincontrols.mouse_mode
