version: 0012af9b
tdp:
  qam:
    tdp: 45
    boost: default
    fan:
      mode: default
      manual_edge:
        st40: default
        st45: default
        st50: default
        st55: default
        st60: default
        st65: default
        st70: default
        st80: default
        st90: default
      manual_junction:
        st40: default
        st50: default
        st60: default
        st70: default
        st80: default
        st90: default
        st100: default
  amd_energy:
    enable_error: default
  smu:
    energy_policy: default
    std:
      fast_limit: 45
      slow_limit: 45
      skin_limit: 45
      stapm_limit: 45
    adv:
      temp_target: 90
      slow_time: default
      stapm_time: default
      enable: default
  tdp:
    tdp_enable: false
    tdp_error: ''
  asus:
    tdp_v2:
      mode: performance
  battery:
    charge_limit: p80
controllers:
  gpd_win:
    controller_mode:
      mode: default
      hidden:
        info: default
        noob_mode: default
      uinput:
        info: default
        paddles_as: steam_input
        nintendo_qam: default
      xbox_elite:
        info: default
      dualsense:
        info: default
        paddles_as: default
        sync_gyro: default
        flip_z: default
        bluetooth_mode: default
      disabled:
        info: default
    l4r4: default
    main_chords: default
    imu: default
    imu_hz: default
    imu_axis:
      mode: default
      remapped:
        manufacturer: default
        product: default
        x_axis: default
        x_invert: default
        y_axis: default
        y_invert: default
        z_axis: default
        z_invert: default
    nintendo_mode: default
  rog_ally:
    controller_mode:
      uinput:
        paddles_as: steam_input
    limits:
      mode: manual
      manual:
        ls_min: 2
        rs_min: 2
wincontrols:
  wincontrols:
    mouse_mode: default
    mouse_mode_triggers: default
    l4r4: default
    deadzones:
      mode: default
      custom:
        ls_center: default
        ls_boundary: default
        rs_center: default
        rs_boundary: default
    vibration: default
gamemode:
  power:
    hibernate_auto: default
shortcuts:
  controller:
    xbox_y: default
    xbox_b: default
    xbox_a: default
    xbox_x: default
    allow_select: default
  touchscreen:
    bottom: default
    right_top: default
    right_bottom: default
    left_top: default
    left_bottom: default
    top: default
    orientation:
      mode: default
      manual:
        dmi: default
        portrait: default
        flip_x: default
        flip_y: default
  keyboard:
    meta_press: default
    meta_hold: default
    ctrl_3: default
    ctrl_4: default
hhd:
  settings:
    language: default
    theme: default
    tdp_enable: true
    enforce_limits: default
    amd_energy_enable: default
    amd_energy_ppd: default
    powerbuttond: default
  http:
    localhost: default
    token: default
  steamos:
    gpu_set: default
rgb:
  handheld:
    mode:
      solid:
        hue: 310
        saturation: 70
        brightness: 10

